# iVIT-SDK Release Automation
#
# 觸發條件：
#   - 推送 tag (v*)
#   - 手動觸發 (workflow_dispatch)
#
# 產出：
#   - Tarball (3 平台)
#   - Deb 套件 (3 平台)
#
# 發佈前提：
#   - tag／輸入的版號必須與原始碼中宣告的版號一致 (scripts/ci/check_version.sh)
#   - CI (ci.yml) 必須先全部通過，才會開始打包

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.1.0)'
        required: true
        default: '1.1.0'
      platforms:
        description: 'Platforms to build (comma-separated or "all")'
        required: true
        default: 'all'


jobs:
  # ==========================================================================
  # 品質關卡：CI 全部通過才會打包
  # ==========================================================================
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ==========================================================================
  # 準備階段：解析版本與平台
  # ==========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check the version matches the source tree
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/ci/check_version.sh "$RELEASE_VERSION"

      - name: Build matrix
        id: matrix
        run: |
          PLATFORMS="${{ github.event.inputs.platforms || 'all' }}"
          if [[ "$PLATFORMS" == "all" ]]; then
            MATRIX='["x86_64-nvidia", "x86_64-intel", "aarch64-jetson"]'
          else
            # Convert comma-separated to JSON array
            MATRIX=$(echo "$PLATFORMS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

  # ==========================================================================
  # Tarball 建置
  # ==========================================================================
  build-tarball:
    needs: [prepare, ci]
    # x86 platforms are pinned to 24.04 to match the apt sources below (OpenVINO 2025 ubuntu24,
    # NVIDIA cuda/repos/ubuntu2404). Jetson builds on a self-hosted runner with JetPack installed.
    runs-on: ${{ matrix.platform == 'aarch64-jetson' && 'self-hosted-arm64' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python build dependencies (bindings and wheel)
        run: python -m pip install "pybind11>=2.11" "scikit-build-core>=0.8" numpy

      # Versions are pinned: an unpinned `apt install libnvinfer-dev` resolves to the newest
      # TensorRT major in the repository, which changes the libnvinfer soname the SDK links.
      - name: Setup CUDA and TensorRT (x86_64 NVIDIA)
        if: matrix.platform == 'x86_64-nvidia'
        env:
          CUDA_VERSION: '12-9'
          TRT_VERSION: '11.4.0.106-1+cuda12.9'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          rm cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-nvcc-${CUDA_VERSION}" "cuda-cudart-dev-${CUDA_VERSION}" \
            "libnvinfer11=${TRT_VERSION}" "libnvinfer-dev=${TRT_VERSION}" \
            "libnvinfer-headers-dev=${TRT_VERSION}" "libnvinfer-safe-headers-dev=${TRT_VERSION}" \
            "libnvonnxparsers11=${TRT_VERSION}" "libnvonnxparsers-dev=${TRT_VERSION}"
          CUDA_HOME="/usr/local/cuda-${CUDA_VERSION/-/.}"
          echo "${CUDA_HOME}/bin" >> "$GITHUB_PATH"
          echo "CUDAToolkit_ROOT=${CUDA_HOME}" >> "$GITHUB_ENV"

      - name: Check JetPack (Jetson)
        if: matrix.platform == 'aarch64-jetson'
        run: |
          # The self-hosted runner must have JetPack (CUDA + TensorRT) installed.
          test -x /usr/local/cuda/bin/nvcc || { echo "::error::JetPack CUDA not found on runner"; exit 1; }
          test -f /usr/include/aarch64-linux-gnu/NvInfer.h || { echo "::error::JetPack TensorRT not found on runner"; exit 1; }
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDAToolkit_ROOT=/usr/local/cuda" >> "$GITHUB_ENV"

      - name: Setup OpenVINO (Intel platform)
        if: contains(matrix.platform, 'intel')
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/openvino ubuntu24 main" | sudo tee /etc/apt/sources.list.d/intel-openvino.list
          sudo apt-get update
          OV=2026.4.1   # the unversioned repo has no meta package: name the parts the SDK uses
          sudo apt-get install -y "libopenvino-dev-$OV" "libopenvino-intel-cpu-plugin-$OV" \
            "libopenvino-intel-gpu-plugin-$OV" "libopenvino-intel-npu-plugin-$OV" \
            "libopenvino-auto-plugin-$OV" "libopenvino-hetero-plugin-$OV" \
            "libopenvino-auto-batch-plugin-$OV"

      - name: Build tarball
        run: |
          chmod +x scripts/build_tarball.sh
          ./scripts/build_tarball.sh ${{ matrix.platform }}

      - name: Verify tarball
        run: |
          chmod +x scripts/verify_package.sh
          ./scripts/verify_package.sh tarball build-tarball-${{ matrix.platform }}/ivit-sdk-*.tar.xz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.platform }}
          path: build-tarball-${{ matrix.platform }}/ivit-sdk-*.tar.xz
          retention-days: 30

  # ==========================================================================
  # Deb 套件建置
  # ==========================================================================
  build-deb:
    needs: [prepare, ci]
    # x86 platforms are pinned to 24.04 to match the apt sources below (OpenVINO 2025 ubuntu24,
    # NVIDIA cuda/repos/ubuntu2404). Jetson builds on a self-hosted runner with JetPack installed.
    runs-on: ${{ matrix.platform == 'aarch64-jetson' && 'self-hosted-arm64' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev dpkg-dev

      # Versions are pinned: an unpinned `apt install libnvinfer-dev` resolves to the newest
      # TensorRT major in the repository, which changes the libnvinfer soname the SDK links.
      - name: Setup CUDA and TensorRT (x86_64 NVIDIA)
        if: matrix.platform == 'x86_64-nvidia'
        env:
          CUDA_VERSION: '12-9'
          TRT_VERSION: '11.4.0.106-1+cuda12.9'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          rm cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "cuda-nvcc-${CUDA_VERSION}" "cuda-cudart-dev-${CUDA_VERSION}" \
            "libnvinfer11=${TRT_VERSION}" "libnvinfer-dev=${TRT_VERSION}" \
            "libnvinfer-headers-dev=${TRT_VERSION}" "libnvinfer-safe-headers-dev=${TRT_VERSION}" \
            "libnvonnxparsers11=${TRT_VERSION}" "libnvonnxparsers-dev=${TRT_VERSION}"
          CUDA_HOME="/usr/local/cuda-${CUDA_VERSION/-/.}"
          echo "${CUDA_HOME}/bin" >> "$GITHUB_PATH"
          echo "CUDAToolkit_ROOT=${CUDA_HOME}" >> "$GITHUB_ENV"

      - name: Check JetPack (Jetson)
        if: matrix.platform == 'aarch64-jetson'
        run: |
          # The self-hosted runner must have JetPack (CUDA + TensorRT) installed.
          test -x /usr/local/cuda/bin/nvcc || { echo "::error::JetPack CUDA not found on runner"; exit 1; }
          test -f /usr/include/aarch64-linux-gnu/NvInfer.h || { echo "::error::JetPack TensorRT not found on runner"; exit 1; }
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
          echo "CUDAToolkit_ROOT=/usr/local/cuda" >> "$GITHUB_ENV"

      - name: Setup OpenVINO (Intel platform)
        if: contains(matrix.platform, 'intel')
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor -o /usr/share/keyrings/intel.gpg
          echo "deb [signed-by=/usr/share/keyrings/intel.gpg] https://apt.repos.intel.com/openvino ubuntu24 main" | sudo tee /etc/apt/sources.list.d/intel-openvino.list
          sudo apt-get update
          OV=2026.4.1   # the unversioned repo has no meta package: name the parts the SDK uses
          sudo apt-get install -y "libopenvino-dev-$OV" "libopenvino-intel-cpu-plugin-$OV" \
            "libopenvino-intel-gpu-plugin-$OV" "libopenvino-intel-npu-plugin-$OV" \
            "libopenvino-auto-plugin-$OV" "libopenvino-hetero-plugin-$OV" \
            "libopenvino-auto-batch-plugin-$OV"

      - name: Build deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh ${{ matrix.platform }}

      - name: Verify deb
        run: |
          chmod +x scripts/verify_package.sh
          ./scripts/verify_package.sh deb build-deb-${{ matrix.platform }}/ivit-sdk_*.deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.platform }}
          path: build-deb-${{ matrix.platform }}/ivit-sdk_*.deb
          retention-days: 30

  # ==========================================================================
  # GitHub Release 發布
  # ==========================================================================
  publish-release:
    needs: [prepare, build-tarball, build-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.tar.xz" -exec cp {} release/ \;
          find artifacts -name "*.deb" -exec cp {} release/ \;
          ls -la release/

      - name: Generate release notes
        id: release-notes
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          cat << EOF > release-notes.md
          ## iVIT-SDK v${VERSION}

          ### 下載說明

          | 平台 | Tarball | Deb |
          |------|---------|-----|
          | x86_64 + NVIDIA | \`ivit-sdk-${VERSION}-x86_64-nvidia.tar.xz\` | \`ivit-sdk_${VERSION}_amd64-nvidia.deb\` |
          | x86_64 + Intel | \`ivit-sdk-${VERSION}-x86_64-intel.tar.xz\` | \`ivit-sdk_${VERSION}_amd64-intel.deb\` |
          | aarch64 + Jetson | \`ivit-sdk-${VERSION}-aarch64-jetson.tar.xz\` | \`ivit-sdk_${VERSION}_arm64-nvidia.deb\` |

          ### 安裝方式

          **Tarball**
          \`\`\`bash
          tar -xf ivit-sdk-${VERSION}-<platform>.tar.xz
          cd ivit-sdk-${VERSION}-<platform>
          source bin/setup_env.sh
          \`\`\`

          **Deb**
          \`\`\`bash
          sudo dpkg -i ivit-sdk_${VERSION}_<arch>-<backend>.deb
          sudo apt-get install -f  # 安裝依賴
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: iVIT-SDK v${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: release/*
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'rc') || contains(needs.prepare.outputs.version, 'beta') }}

  # ==========================================================================
  # 通知
  # ==========================================================================
  notify:
    needs: [ci, prepare, build-tarball, build-deb, publish-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          echo "✅ Release v${{ needs.prepare.outputs.version }} completed successfully!"
          # 可加入 Slack/Teams webhook 通知

      - name: Notify on failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "❌ Release v${{ needs.prepare.outputs.version }} failed!"
          exit 1
