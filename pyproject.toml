[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "ivit-sdk"
version = "1.1.0"
description = "iVIT-SDK: Innodisk Vision Intelligence Toolkit - Unified CV SDK with extensible hardware support"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Innodisk", email = "support@innodisk.com"}
]
maintainers = [
    {name = "Innodisk AI Team", email = "ai@innodisk.com"}
]
keywords = [
    "computer-vision",
    "deep-learning",
    "inference",
    "openvino",
    "tensorrt",
    "ai",
    "sdk",
    "edge-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"  # OpenVINO 2026 has no Python 3.9 wheels
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.5",
    "pillow>=8.0",
    "pyyaml>=5.4",
    "requests>=2.25",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Backend-specific dependencies
# pip OpenVINO before 2026 is built with the old C++ ABI (_GLIBCXX_USE_CXX11_ABI=0) and cannot be
# linked with the system OpenCV the SDK uses; 2026 ships the new ABI. See the manual, 3.2.
openvino = [
    "openvino>=2026.0",
]
# Feature dependencies
# Exporting from source weights (download(..., from_source=True)). torch >= 2.9 exports through
# onnxscript. YOLOX also needs the yolox package, whose PyPI release does not build: put its
# source tree on PYTHONPATH (the error raised without it says how).
zoo = [
    "torch>=2.0",
    "torchvision>=0.15",
    "onnx>=1.14",
    "onnxscript>=0.1",
]
train = [
    "torch>=2.0",
    "torchvision>=0.15",
    "albumentations>=1.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "onnx>=1.14",  # the tests build their small ONNX models with it; without it ~20 files skip
    "flake8>=6.0",
]
# Combined installations
all = [
    "ivit-sdk[openvino,zoo,train,dev]",
]
# No [tensorrt] extra: the SDK links the TensorRT it was built against (system or bundled) and
# never loads the pip tensorrt package, so installing it changed nothing.

[project.urls]
Homepage = "https://github.com/InnoIPA/ivit-sdk"
Repository = "https://github.com/InnoIPA/ivit-sdk"
Issues = "https://github.com/InnoIPA/ivit-sdk/issues"

[project.scripts]
ivit = "ivit.cli:main"

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["python/ivit"]
wheel.install-dir = "ivit"
sdist.exclude = [
    ".venv/**", "venv/**", "build*/**", "dist/**", "deps/**", "models/**",
    "**/__pycache__/**", "**/*.pyc", "**/*.so", "**/*.pyd", "**/*.egg-info/**",
    "**/bin/**", "**/obj/**", ".pytest_cache/**", ".env*", "**/*.log",
    "**/*.engine", "**/*.trt", "**/*.plan", "**/*.blob", "model_cache/**",
    "examples/data/**/*_output.*", "examples/data/**/*_result.*",
    "examples/data/**/output.*", ".claude/**", ".codex/**", ".agents/**",
]

[tool.scikit-build.cmake.define]
IVIT_BUILD_PYTHON = "ON"
IVIT_BUILD_TESTS = "OFF"
IVIT_BUILD_EXAMPLES = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["python/ivit"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
